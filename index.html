<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PP COFFEE</title><script src="./qrcode.min.js"></script><style>
:root{--o:#e97928;--g:#238e63;--bg:#17120f;--card:#2c241f;--line:#55473e;--muted:#c7bbb3}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#17120fdd,#17120ff4),url('29d2d3817e.png') center/cover fixed;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:900px;margin:auto;padding-bottom:88px}header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#17120ff2;border-bottom:1px solid var(--line)}#logo{font-size:20px;font-weight:900;color:#ff9c54;user-select:none}.btn,.add{border:0;border-radius:10px;padding:10px 14px;background:var(--g);color:#fff;font-weight:800}.hero{padding:22px 15px 7px}.hero h1{margin:0}.muted{color:var(--muted);font-size:13px}.tabs{display:flex;gap:8px;overflow:auto;padding:10px 13px}.tab{border:1px solid var(--line);border-radius:18px;padding:8px 14px;background:#2b241f;color:#fff;white-space:nowrap}.tab.on{background:var(--o)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;padding:12px}.menu{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}.menu img{width:100%;height:140px;object-fit:cover}.pad{padding:11px}.price{font-weight:900;color:#ffa05a}.add{width:100%;background:var(--o);margin-top:8px}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#17120ff5;border-top:1px solid var(--line);padding:10px 15px}.bottom>div{max-width:870px;margin:auto;display:flex;justify-content:space-between;align-items:center}.overlay{display:none;position:fixed;inset:0;z-index:30;background:#000c;align-items:flex-end;justify-content:center;padding:9px}.overlay.show{display:flex}.sheet{width:100%;max-width:700px;max-height:94vh;overflow:auto;background:#201a17;border:1px solid var(--line);border-radius:20px;padding:15px}.head,.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.close,.small{border:1px solid var(--line);border-radius:8px;padding:8px;background:#3a302a;color:#fff}.field{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#15110f;color:#fff}.section,.item,.adminItem{background:#302823;border:1px solid var(--line);border-radius:12px;padding:11px;margin:10px 0}.qty{display:flex;align-items:center;gap:8px}.qty button{width:32px;height:32px}.danger{background:#93453d}.adminTop{display:grid;grid-template-columns:1fr 90px;gap:7px}.adminMenu{display:grid;grid-template-columns:1fr 85px 100px;gap:7px}.status{display:flex;align-items:center;gap:7px}.status input{width:20px;height:20px}.hiddenItem{opacity:.58;border-color:#a85b4d}.orderBtns{display:flex;gap:5px}.preview{width:72px;height:72px;object-fit:cover;border-radius:9px}.qrbox{width:205px;height:205px;padding:10px;margin:10px auto;background:#fff}.qrbox canvas{display:block!important;width:185px!important;height:185px!important}.qrbox img{display:none!important}.loading{display:none;position:fixed;inset:0;z-index:50;background:#000c;place-items:center}.loading.show{display:grid}@media(min-width:680px){.grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div id="loading" class="loading"><b>กำลังดำเนินการ...</b></div><div class="wrap"><header><div id="logo" onclick="logoTap()">PP COFFEE</div><button class="btn" onclick="openCart()">ตะกร้า <span id="count">0</span></button></header><section class="hero"><h1>เลือกเมนูที่ชอบ</h1><div class="muted">เลือกความหวาน Topping และระบุหมายเหตุได้</div></section><div id="tabs" class="tabs"></div><main id="grid" class="grid"></main></div><div class="bottom"><div><b id="totalText">0 บาท</b><button class="btn" onclick="openCart()">รีวิวออเดอร์</button></div></div>
<div id="custom" class="overlay"><div class="sheet"><div class="head"><h2 id="customTitle"></h2><button class="close" onclick="hide('custom')">ปิด</button></div><label>ระดับความหวาน</label><select id="sweet" class="field"><option>0% ไม่หวาน</option><option>หวานน้อย</option><option selected>หวานปกติ</option><option>หวานมาก</option></select><div class="section"><b>Topping</b><div id="topChoices"></div></div><label>หมายเหตุของเมนูนี้</label><input id="remark" class="field" placeholder="เช่น แยกน้ำแข็ง ไม่ใส่นม"><button class="btn" style="width:100%;margin-top:10px" onclick="confirmAdd()">เพิ่มลงตะกร้า</button></div></div>
<div id="cart" class="overlay"><div class="sheet"><div class="head"><h2>รีวิวออเดอร์</h2><button class="close" onclick="hide('cart')">ปิด</button></div><div id="cartBody"></div></div></div>
<div id="login" class="overlay"><div class="sheet" style="max-width:400px"><div class="head"><h2>เข้าสู่ Admin</h2><button class="close" onclick="hide('login')">ปิด</button></div><input id="pass" type="password" class="field" placeholder="รหัสผ่าน"><button class="btn" style="width:100%;margin-top:10px" onclick="adminLogin()">เข้าสู่ระบบ</button></div></div>
<div id="admin" class="overlay"><div class="sheet"><div class="head"><h2>จัดการร้านค้า</h2><button class="close" onclick="hide('admin')">ปิด</button></div><div class="section"><b>จำนวนครั้งที่กดโลโก้</b><input id="clicks" class="field" type="number" min="1" max="20"></div><div class="section"><div class="row"><b>จัดการ Topping</b><button class="small" onclick="addTop()">เพิ่ม</button></div><div id="adminTops"></div></div><div class="section"><div class="row"><b>จัดการเมนู</b><button class="small" onclick="addMenu()">เพิ่ม</button></div><div id="adminMenus"></div></div><button class="btn" style="width:100%" onclick="saveAdmin()">บันทึกการตั้งค่า</button></div></div>
<div id="success" class="overlay"><div class="sheet" style="text-align:center"><h2>รับออเดอร์แล้ว</h2><h2 id="orderNo"></h2><button class="btn" onclick="resetOrder()">กลับหน้าร้าน</button></div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbwuarwo1AfdnP7cfQO2o2WhUVy7Shh5S1SudlMZLDREliQoLP6jvQcRQUEX8I3lFZXg/exec',fallback='https://images.unsplash.com/photo-1509042239860-f550ce710b93?q=80&w=600&auto=format&fit=crop';let menus=[],tops=[],categories=[],settings={},cartItems=[],selected=null,payment='',adminToken='',filter='ทั้งหมด',tap=0,timer;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function apiGet(action){const r=await fetch(API+'?action='+encodeURIComponent(action)+'&_='+Date.now()),j=await r.json();if(!j.ok)throw Error(j.error||'โหลดข้อมูลไม่สำเร็จ');return j}async function apiPost(data){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)}),j=await r.json();if(!j.ok)throw Error(j.error||'ดำเนินการไม่สำเร็จ');return j}function busy(v){$('loading').classList.toggle('show',!!v)}function hide(id){$(id).classList.remove('show')}
async function loadStore(){busy(1);try{const d=(await apiGet('getStoreData')).data;settings=d;menus=d.menus||[];tops=d.toppings||[];categories=d.categories||[];$('logo').textContent=d.shopName||'PP COFFEE';renderTabs();renderMenu()}catch(e){alert(e.message)}finally{busy(0)}}function renderTabs(){const list=['ทั้งหมด',...categories.map(x=>x.name)];$('tabs').innerHTML=list.map((x,i)=>`<button class="tab ${x===filter?'on':''}" onclick="setFilterByIndex(${i})">${esc(x)}</button>`).join('')}function setFilterByIndex(i){filter=['ทั้งหมด',...categories.map(x=>x.name)][i];renderTabs();renderMenu()}function renderMenu(){const a=(filter==='ทั้งหมด'?menus:menus.filter(x=>x.category===filter)).slice().sort((a,b)=>a.sortOrder-b.sortOrder);$('grid').innerHTML=a.map(m=>`<article class="menu"><img src="${m.image||fallback}" onerror="this.onerror=null;this.src='${fallback}'"><div class="pad"><b>${esc(m.name)}</b><div class="price">${Number(m.price).toLocaleString()} บาท</div><button class="add" onclick="choose('${m.id}')">เพิ่มลงตะกร้า</button></div></article>`).join('')||'<p>ยังไม่มีเมนู</p>'}
function choose(id){selected=menus.find(x=>String(x.id)===String(id));if(!selected)return;$('customTitle').textContent=selected.name;$('remark').value='';$('topChoices').innerHTML=tops.map((t,i)=>`<label class="row item"><span>${esc(t.name)} +${t.price} บาท</span><input class="tc" data-i="${i}" type="checkbox"></label>`).join('')||'<div class="muted">ไม่มี Topping</div>';$('custom').classList.add('show')}function confirmAdd(){const tt=[...document.querySelectorAll('.tc:checked')].map(x=>tops[+x.dataset.i]),key=[selected.id,$('sweet').value,tt.map(x=>x.id).join('|'),$('remark').value].join('::'),old=cartItems.find(x=>x.key===key);if(old)old.qty++;else cartItems.push({...selected,key,qty:1,sweetness:$('sweet').value,toppings:tt,remark:$('remark').value.trim()});hide('custom');refresh()}function unit(x){return Number(x.price)+(x.toppings||[]).reduce((s,t)=>s+Number(t.price||0),0)}function sum(){return cartItems.reduce((s,x)=>s+unit(x)*x.qty,0)}function refresh(){const n=cartItems.reduce((s,x)=>s+x.qty,0);$('count').textContent=n;$('totalText').textContent=sum().toLocaleString()+' บาท'}function changeQty(i,d){cartItems[i].qty+=d;if(cartItems[i].qty<1)cartItems.splice(i,1);renderCart();refresh()}function removeItem(i){cartItems.splice(i,1);renderCart();refresh()}function updateRemark(i,v){if(cartItems[i])cartItems[i].remark=v}
function openCart(){renderCart();$('cart').classList.add('show')}function renderCart(){if(!cartItems.length){$('cartBody').innerHTML='<p class="muted" style="text-align:center;padding:30px">ยังไม่มีรายการ</p>';return}$('cartBody').innerHTML=cartItems.map((x,i)=>`<div class="item"><div class="row"><b>${esc(x.name)}</b><button class="small danger" onclick="removeItem(${i})">ลบ</button></div><div class="muted">${esc(x.sweetness)}${x.toppings.length?' | '+x.toppings.map(t=>esc(t.name)).join(', '):''}</div><label class="muted" style="display:block;margin-top:8px">หมายเหตุของเมนูนี้</label><input class="field" value="${esc(x.remark||'')}" placeholder="เช่น แยกน้ำแข็ง ไม่ใส่นม" oninput="updateRemark(${i},this.value)"><div class="row" style="margin-top:8px"><div class="qty"><button class="small" onclick="changeQty(${i},-1)">-</button><b>${x.qty}</b><button class="small" onclick="changeQty(${i},1)">+</button></div><b>${(unit(x)*x.qty).toLocaleString()} บาท</b></div></div>`).join('')+`<div class="section row"><b>ยอดรวม</b><b class="price">${sum().toLocaleString()} บาท</b></div><div class="section"><label>ชื่อผู้สั่ง</label><input id="customer" class="field"><div class="row" style="margin-top:10px"><button class="small" onclick="selectPay('Cash')">เงินสด</button><button class="small" onclick="selectPay('PromptPay')">PromptPay</button></div><div id="payArea"></div></div><button class="btn" style="width:100%" onclick="submitOrder()">ยืนยันออเดอร์</button>`;if(payment)setTimeout(()=>selectPay(payment),0)}
function tlv(id,v){return id+String(v.length).padStart(2,'0')+v}function crc16(text){let crc=65535;for(let i=0;i<text.length;i++){crc^=text.charCodeAt(i)<<8;for(let j=0;j<8;j++)crc=(crc&32768)?(crc<<1)^4129:crc<<1;crc&=65535}return crc.toString(16).toUpperCase().padStart(4,'0')}function promptPayPayload(recipient,amount){const id=String(recipient||'').replace(/\D/g,'');let target;if(id.length===10)target=tlv('01','0066'+id.slice(1));else if(id.length===13)target=tlv('02',id);else throw Error('PROMPTPAY_NUMBER ต้องเป็น 10 หรือ 13 หลัก');const merchant=tlv('00','A000000677010111')+target;let p=tlv('00','01')+tlv('01','12')+tlv('29',merchant)+tlv('53','764')+tlv('54',Number(amount).toFixed(2))+tlv('58','TH')+'6304';return p+crc16(p)}function formatAccount(v){const x=String(v||'').replace(/\D/g,'');return x.length===10?x.slice(0,3)+'-'+x.slice(3,6)+'-'+x.slice(6):x}function renderQR(){const box=$('qr');if(!box)return;box.innerHTML='';try{if(typeof QRCode==='undefined')throw Error('ไม่พบ QRCode Library');new QRCode(box,{text:promptPayPayload(settings.promptpayNumber,sum()),width:185,height:185,colorDark:'#000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M})}catch(e){box.innerHTML='<div style="color:#a22;padding:10px">'+esc(e.message)+'</div>'}}function selectPay(type){payment=type;const area=$('payArea');if(type==='Cash'){area.innerHTML='<div class="section"><b>ชำระเงินสดเมื่อรับสินค้า</b></div>';return}area.innerHTML=`<div class="section" style="text-align:center"><b>ชำระผ่าน PromptPay</b><div id="qr" class="qrbox"></div><b>${esc(settings.promptpayName||'ยังไม่ได้กำหนดชื่อบัญชี')}</b><div class="muted">${esc(formatAccount(settings.promptpayNumber))}</div><div class="price" style="margin:8px">ยอดชำระ ${sum().toLocaleString()} บาท</div><label class="muted">แนบสลิป</label><input id="slip" type="file" class="field" accept="image/*"></div>`;setTimeout(renderQR,0)}
function fileData(file,max=1200){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height;if(Math.max(w,h)>max){const q=max/Math.max(w,h);w*=q;h*=q}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(file)})}async function submitOrder(){const customer=$('customer');if(!customer||!customer.value.trim())return alert('กรุณาระบุชื่อผู้สั่ง');if(!payment)return alert('กรุณาเลือกวิธีชำระเงิน');let slipData='';if(payment==='PromptPay'){const f=$('slip')&&$('slip').files[0];if(!f)return alert('กรุณาแนบสลิป');slipData=await fileData(f)}busy(1);try{const r=await apiPost({action:'submitOrder',order:{customerName:customer.value.trim(),paymentMethod:payment,slipData,items:cartItems.map(x=>({menuId:x.id,menuName:x.name,sweetness:x.sweetness,toppings:x.toppings,remark:x.remark,quantity:x.qty,basePrice:x.price}))}});$('orderNo').textContent=r.orderNo;hide('cart');$('success').classList.add('show')}catch(e){alert(e.message)}finally{busy(0)}}function resetOrder(){cartItems=[];payment='';hide('success');refresh()}
function logoTap(){tap++;clearTimeout(timer);timer=setTimeout(()=>tap=0,1800);if(tap>=Number(settings.requiredClicks||7)){tap=0;$('login').classList.add('show')}}async function adminLogin(){busy(1);try{const r=await apiPost({action:'verifyAdmin',password:$('pass').value});adminToken=r.adminToken;hide('login');$('pass').value='';await loadAdmin()}catch(e){alert(e.message)}finally{busy(0)}}async function loadAdmin(){const d=(await apiPost({action:'getAdminData',adminToken})).data;menus=d.menus||[];tops=d.toppings||[];categories=d.categories||[];$('clicks').value=d.requiredClicks;renderAdmin();$('admin').classList.add('show')}function moveItem(type,i,d){const a=type==='menu'?menus:tops,n=i+d;if(n<0||n>=a.length)return;[a[i],a[n]]=[a[n],a[i]];a.forEach((x,k)=>x.sortOrder=k+1);renderAdmin()}function toggleItem(type,i,v){(type==='menu'?menus:tops)[i].active=v;renderAdmin()}
function renderAdmin(){$('adminTops').innerHTML=tops.map((t,i)=>`<div class="adminItem ${t.active?'':'hiddenItem'}"><div class="adminTop"><input class="field tn" value="${esc(t.name)}"><input class="field tp" type="number" value="${t.price}"></div><div class="row" style="margin-top:8px"><label class="status"><input type="checkbox" ${t.active?'checked':''} onchange="toggleItem('top',${i},this.checked)">${t.active?'เปิดให้เลือก':'ซ่อนอยู่'}</label><div class="orderBtns"><button class="small" onclick="moveItem('top',${i},-1)">ขึ้น</button><button class="small" onclick="moveItem('top',${i},1)">ลง</button></div></div></div>`).join('');$('adminMenus').innerHTML=menus.map((m,i)=>`<div class="adminItem ${m.active?'':'hiddenItem'}"><div class="adminMenu"><input class="field mn" value="${esc(m.name)}"><input class="field mp" type="number" value="${m.price}"><input class="field mc" value="${esc(m.category)}"></div><div class="row" style="margin-top:8px"><div class="row"><img class="preview" src="${m.image||fallback}"><input type="file" accept="image/*" onchange="menuImage(this,${i})"></div><div class="orderBtns"><button class="small" onclick="moveItem('menu',${i},-1)">ขึ้น</button><button class="small" onclick="moveItem('menu',${i},1)">ลง</button></div></div><label class="status"><input type="checkbox" ${m.active?'checked':''} onchange="toggleItem('menu',${i},this.checked)">${m.active?'แสดงขาย':'ซ่อนอยู่'}</label></div>`).join('')}function addTop(){tops.push({id:Date.now(),name:'Topping ใหม่',price:0,active:true,sortOrder:tops.length+1});renderAdmin()}function addMenu(){menus.push({id:Date.now(),name:'เมนูใหม่',category:'Coffee',price:0,image:'',imageFileId:'',active:true,sortOrder:menus.length+1});renderAdmin()}async function menuImage(el,i){if(el.files[0]){menus[i].image=await fileData(el.files[0],900);renderAdmin()}}async function saveAdmin(){const tr=[...$('adminTops').querySelectorAll('.adminItem')],mr=[...$('adminMenus').querySelectorAll('.adminItem')];tops=tops.map((x,i)=>({...x,name:tr[i].querySelector('.tn').value.trim(),price:+tr[i].querySelector('.tp').value,sortOrder:i+1}));menus=menus.map((x,i)=>({...x,name:mr[i].querySelector('.mn').value.trim(),price:+mr[i].querySelector('.mp').value,category:mr[i].querySelector('.mc').value.trim(),sortOrder:i+1}));busy(1);try{await apiPost({action:'saveStoreData',adminToken,data:{settings:{ADMIN_REQUIRED_CLICKS:+$('clicks').value},menus,toppings:tops}});hide('admin');await loadStore();alert('บันทึกเรียบร้อย')}catch(e){alert(e.message)}finally{busy(0)}}loadStore();refresh();
</script></body></html>
