<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CRAFT & CAFE</title><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><style>
:root{--o:#ed7b2d;--g:#21966a;--bg:#16120f;--card:#2b2420;--line:#53473f;--muted:#c4b8b0}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#17120fdd,#17120ff0),url('29d2d3817e.png') center/cover fixed;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:900px;margin:auto;padding-bottom:88px}header{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#17120fee;border-bottom:1px solid var(--line)}#logo{font-weight:900;color:#ffa15e;font-size:20px}.btn{border:0;border-radius:11px;padding:10px 14px;color:#fff;background:var(--g);font-weight:800}.hero{padding:24px 16px 8px}.hero h1{margin:0}.muted{color:var(--muted);font-size:13px}.tabs{display:flex;gap:8px;overflow:auto;padding:10px 14px}.tab{border:1px solid var(--line);background:#2a231f;color:#fff;padding:8px 14px;border-radius:18px}.tab.on{background:var(--o)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}.menu{background:#29221e;border:1px solid var(--line);border-radius:16px;overflow:hidden}.menu img{width:100%;height:140px;object-fit:cover}.pad{padding:11px}.price{color:#ffa15e;font-weight:900}.add{width:100%;border:0;background:var(--o);color:#fff;padding:10px;border-radius:9px;font-weight:800}.bottom{position:fixed;bottom:0;left:0;right:0;background:#17120ff5;border-top:1px solid var(--line);padding:10px 15px}.bottom>div{max-width:870px;margin:auto;display:flex;justify-content:space-between;align-items:center}.overlay{display:none;position:fixed;inset:0;z-index:30;background:#000c;align-items:flex-end;justify-content:center;padding:10px}.overlay.show{display:flex}.sheet{width:100%;max-width:700px;max-height:94vh;overflow:auto;background:#201a17;border:1px solid var(--line);border-radius:20px;padding:16px}.head{display:flex;justify-content:space-between;align-items:center}.close,.small{border:1px solid var(--line);background:#3b312b;color:#fff;border-radius:8px;padding:8px}.field{width:100%;background:#14110f;color:#fff;border:1px solid var(--line);border-radius:9px;padding:10px}.section,.item,.adminItem{background:#302823;border:1px solid var(--line);border-radius:12px;padding:11px;margin:10px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.status{display:flex;align-items:center;gap:8px}.status input{width:20px;height:20px}.hiddenItem{opacity:.58;border-color:#9f5b4e}.orderBtns{display:flex;gap:5px}.orderBtns button{min-width:38px}.adminTop{display:grid;grid-template-columns:1fr 90px;gap:8px}.adminMenu{display:grid;grid-template-columns:1fr 85px 100px;gap:8px}.preview{width:72px;height:72px;object-fit:cover;border-radius:9px}.danger{background:#93453d}.qrbox{background:#fff;width:205px;height:205px;padding:10px;margin:10px auto}.qrbox canvas{display:block!important;width:185px!important;height:185px!important}.qrbox img{display:none!important}.loading{display:none;position:fixed;inset:0;z-index:50;background:#000b;place-items:center}.loading.show{display:grid}@media(min-width:680px){.grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div class="loading" id="loading">กำลังดำเนินการ...</div><div class="wrap"><header><div id="logo" onclick="logoTap()">CRAFT & CAFE</div><button class="btn" onclick="openCart()">ตะกร้า <span id="count">0</span></button></header><div class="hero"><h1>เลือกเมนูที่ชอบ</h1><div class="muted">เลือกเมนูที่ต้องการ แล้วกดที่ตะกร้าเพื่อรีวิวก่อนชำระเงิน</div></div><div class="tabs" id="tabs"></div><main class="grid" id="grid"></main></div><div class="bottom"><div><b id="totalText">0 บาท</b><button class="btn" onclick="openCart()">รีวิวออเดอร์</button></div></div>
<div class="overlay" id="custom"><div class="sheet"><div class="head"><h2 id="customTitle"></h2><button class="close" onclick="hide('custom')">ปิด</button></div><select class="field" id="sweet"><option>0% ไม่หวาน</option><option>หวานน้อย</option><option selected>หวานปกติ</option><option>หวานมากกกก</option></select><div class="section"><b>Topping</b><div id="topChoices"></div></div><input class="field" id="remark" placeholder="หมายเหตุ"><button class="btn" style="width:100%;margin-top:10px" onclick="confirmAdd()">เพิ่มลงตะกร้า</button></div></div>
<div class="overlay" id="cart"><div class="sheet"><div class="head"><h2>รีวิวออเดอร์</h2><button class="close" onclick="hide('cart')">ปิด</button></div><div id="cartBody"></div></div></div>
<div class="overlay" id="login"><div class="sheet" style="max-width:400px"><div class="head"><h2>เข้าสู่ Admin</h2><button class="close" onclick="hide('login')">ปิด</button></div><input id="pass" type="password" class="field" placeholder="รหัสผ่าน"><button class="btn" style="width:100%;margin-top:10px" onclick="adminLogin()">เข้าสู่ระบบ</button></div></div>
<div class="overlay" id="admin"><div class="sheet"><div class="head"><h2>จัดการร้านค้า</h2><button class="close" onclick="hide('admin')">ปิด</button></div><div class="section"><b>จำนวนครั้งที่กดโลโก้</b><input id="clicks" type="number" class="field" min="1" max="20"></div><div class="section"><div class="row"><b>จัดการ Topping</b><button class="small" onclick="addTop()">เพิ่ม</button></div><div id="adminTops"></div></div><div class="section"><div class="row"><b>จัดการเมนู</b><button class="small" onclick="addMenu()">เพิ่ม</button></div><div id="adminMenus"></div></div><button class="btn" style="width:100%" onclick="saveAdmin()">บันทึกการตั้งค่า</button></div></div>
<div class="overlay" id="success"><div class="sheet" style="text-align:center"><h2>รับออเดอร์แล้ว</h2><h2 id="orderNo"></h2><button class="btn" onclick="resetOrder()">กลับหน้าร้าน</button></div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbwuarwo1AfdnP7cfQO2o2WhUVy7Shh5S1SudlMZLDREliQoLP6jvQcRQUEX8I3lFZXg/exec',fallback='https://images.unsplash.com/photo-1509042239860-f550ce710b93?q=80&w=600&auto=format&fit=crop';let menus=[],tops=[],categories=[],settings={},cartItems=[],selected,payment='',adminToken='',filter='ทั้งหมด',tap=0,timer;const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function get(a){let r=await fetch(API+'?action='+a+'&_='+Date.now()),j=await r.json();if(!j.ok)throw Error(j.error);return j}async function post(d){let r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(d)}),j=await r.json();if(!j.ok)throw Error(j.error);return j}function busy(x){loading.classList.toggle('show',x)}function hide(x){$(x).classList.remove('show')}
async function loadStore(){busy(1);try{let d=(await get('getStoreData')).data;settings=d;menus=d.menus||[];tops=d.toppings||[];categories=d.categories||[];logo.textContent=d.shopName||'CRAFT & CAFE';renderTabs();renderMenu()}catch(e){alert(e.message)}finally{busy(0)}}function renderTabs(){tabs.innerHTML=['ทั้งหมด',...categories.map(x=>x.name)].map(x=>`<button class="tab ${x===filter?'on':''}" onclick="setFilter('${esc(x)}')">${esc(x)}</button>`).join('')}function setFilter(x){filter=x;renderTabs();renderMenu()}function renderMenu(){let a=(filter==='ทั้งหมด'?menus:menus.filter(x=>x.category===filter)).sort((a,b)=>a.sortOrder-b.sortOrder);grid.innerHTML=a.map(m=>`<article class="menu"><img src="${m.image||fallback}" onerror="this.src='${fallback}'"><div class="pad"><b>${esc(m.name)}</b><div class="price">${m.price} บาท</div><button class="add" onclick="choose('${m.id}')">เพิ่มลงตะกร้า</button></div></article>`).join('')}function choose(id){selected=menus.find(x=>String(x.id)===String(id));customTitle.textContent=selected.name;remark.value='';topChoices.innerHTML=tops.map((t,i)=>`<label class="row item"><span>${esc(t.name)} +${t.price}</span><input class="tc" data-i="${i}" type="checkbox"></label>`).join('');custom.classList.add('show')}function confirmAdd(){let tt=[...document.querySelectorAll('.tc:checked')].map(x=>tops[+x.dataset.i]);cartItems.push({...selected,qty:1,sweetness:sweet.value,toppings:tt,remark:remark.value});hide('custom');refresh()}function unit(x){return +x.price+x.toppings.reduce((s,t)=>s+(+t.price),0)}function sum(){return cartItems.reduce((s,x)=>s+unit(x)*x.qty,0)}function refresh(){count.textContent=cartItems.reduce((s,x)=>s+x.qty,0);totalText.textContent=sum()+' บาท'}function openCart(){cartBody.innerHTML=cartItems.map((x,i)=>`<div class="item"><div class="row"><b>${esc(x.name)}</b><button class="small danger" onclick="cartItems.splice(${i},1);openCart();refresh()">ลบ</button></div><div class="muted">${esc(x.sweetness)} ${x.toppings.map(t=>esc(t.name)).join(', ')}</div><label class="muted" style="display:block;margin-top:8px">หมายเหตุของเมนูนี้</label><input class="field" value="${esc(x.remark||'')}" placeholder="เช่น แยกน้ำแข็ง ไม่ใส่นม" oninput="updateRemark(${i},this.value)"><div class="row" style="margin-top:8px"><span>x${x.qty}</span><b>${unit(x)*x.qty} บาท</b></div></div>`).join('')+`<div class="section"><b>ชื่อผู้สั่ง</b><input class="field" id="customer"><div class="row" style="margin-top:10px"><button class="small" onclick="pay('Cash')">เงินสด</button><button class="small" onclick="pay('PromptPay')">PromptPay</button></div><div id="payArea"></div></div><button class="btn" style="width:100%" onclick="submitOrder()">ยืนยัน</button>`;cart.classList.add('show');if(payment)pay(payment)}function updateRemark(i,v){if(cartItems[i])cartItems[i].remark=v}function pay(x){payment=x;payArea.innerHTML=x==='PromptPay'?`<div id="qr" class="qrbox"></div><input id="slip" type="file" class="field" accept="image/*">`:'';if(x==='PromptPay')setTimeout(()=>new QRCode(qr,{text:'PromptPay '+settings.promptpayNumber+' '+sum(),width:185,height:185}),0)}function fileData(f){return new Promise((a,b)=>{let r=new FileReader();r.onload=()=>a(r.result);r.onerror=b;r.readAsDataURL(f)})}async function submitOrder(){if(!customer.value.trim()||!payment)return alert('กรุณากรอกชื่อและเลือกการชำระเงิน');let slipData='';if(payment==='PromptPay'){if(!slip.files[0])return alert('กรุณาแนบสลิป');slipData=await fileData(slip.files[0])}busy(1);try{let r=await post({action:'submitOrder',order:{customerName:customer.value,paymentMethod:payment,slipData,items:cartItems.map(x=>({menuId:x.id,menuName:x.name,sweetness:x.sweetness,toppings:x.toppings,remark:x.remark,quantity:x.qty,basePrice:x.price}))}});orderNo.textContent=r.orderNo;hide('cart');success.classList.add('show')}catch(e){alert(e.message)}finally{busy(0)}}function resetOrder(){cartItems=[];payment='';hide('success');refresh()}
function logoTap(){tap++;clearTimeout(timer);timer=setTimeout(()=>tap=0,1800);if(tap>=(settings.requiredClicks||7)){tap=0;login.classList.add('show')}}async function adminLogin(){busy(1);try{let r=await post({action:'verifyAdmin',password:pass.value});adminToken=r.adminToken;hide('login');await loadAdmin()}catch(e){alert(e.message)}finally{busy(0)}}async function loadAdmin(){let d=(await post({action:'getAdminData',adminToken})).data;menus=d.menus;tops=d.toppings;categories=d.categories;clicks.value=d.requiredClicks;renderAdmin();admin.classList.add('show')}function move(a,i,d){let n=i+d;if(n<0||n>=a.length)return;[a[i],a[n]]=[a[n],a[i]];a.forEach((x,k)=>x.sortOrder=k+1);renderAdmin()}function toggle(a,i,v){a[i].active=v;renderAdmin()}
function renderAdmin(){adminTops.innerHTML=tops.map((t,i)=>`<div class="adminItem ${t.active?'':'hiddenItem'}"><div class="adminTop"><input class="field tn" value="${esc(t.name)}"><input class="field tp" type="number" value="${t.price}"></div><div class="row" style="margin-top:8px"><label class="status"><input type="checkbox" ${t.active?'checked':''} onchange="toggle(tops,${i},this.checked)">${t.active?'เปิดให้เลือก':'ซ่อนอยู่'}</label><div class="orderBtns"><button class="small" onclick="move(tops,${i},-1)">ขึ้น</button><button class="small" onclick="move(tops,${i},1)">ลง</button></div></div></div>`).join('');adminMenus.innerHTML=menus.map((m,i)=>`<div class="adminItem ${m.active?'':'hiddenItem'}"><div class="adminMenu"><input class="field mn" value="${esc(m.name)}"><input class="field mp" type="number" value="${m.price}"><input class="field mc" value="${esc(m.category)}"></div><div class="row" style="margin-top:8px"><div class="row"><img class="preview" src="${m.image||fallback}"><input type="file" accept="image/*" onchange="menuImage(this,${i})"></div><div class="orderBtns"><button class="small" onclick="move(menus,${i},-1)">ขึ้น</button><button class="small" onclick="move(menus,${i},1)">ลง</button></div></div><label class="status"><input type="checkbox" ${m.active?'checked':''} onchange="toggle(menus,${i},this.checked)">${m.active?'แสดงขาย':'ซ่อนอยู่'}</label></div>`).join('')}function addTop(){tops.push({id:Date.now(),name:'Topping ใหม่',price:0,active:true,sortOrder:tops.length+1});renderAdmin()}function addMenu(){menus.push({id:Date.now(),name:'เมนูใหม่',category:'Coffee',price:0,image:'',imageFileId:'',active:true,sortOrder:menus.length+1});renderAdmin()}async function menuImage(el,i){if(el.files[0]){menus[i].image=await fileData(el.files[0]);renderAdmin()}}async function saveAdmin(){let tr=[...adminTops.querySelectorAll('.adminItem')];tops=tops.map((x,i)=>({...x,name:tr[i].querySelector('.tn').value.trim(),price:+tr[i].querySelector('.tp').value,sortOrder:i+1}));let mr=[...adminMenus.querySelectorAll('.adminItem')];menus=menus.map((x,i)=>({...x,name:mr[i].querySelector('.mn').value.trim(),price:+mr[i].querySelector('.mp').value,category:mr[i].querySelector('.mc').value.trim(),sortOrder:i+1}));busy(1);try{await post({action:'saveStoreData',adminToken,data:{settings:{ADMIN_REQUIRED_CLICKS:+clicks.value},menus,toppings:tops}});hide('admin');await loadStore();alert('บันทึกเรียบร้อย')}catch(e){alert(e.message)}finally{busy(0)}}loadStore();refresh();
</script></body></html>
